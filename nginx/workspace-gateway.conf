# Workspace gateway (doc/jobseeker/Architecture/workspace-runtimes.md).
#
# Editors of workspace runtime deployments listen on the job runtime's network,
# one port each (JOBSEEKER_WORKSPACE_IDE_PORTS), and serve under /ide/<port>.
# This server publishes them on a port of its own, so an editor never shares
# JobSeeker's origin. Each editor still requires its own connection token.

# Only the editor's own cookie is forwarded: code running in an editor must
# never see a JobSeeker session cookie, which the browser sends to every port
# of the host.
map $http_cookie $jobseeker_ide_cookie {
    default "";
    "~*(?:^|;\s*)(?<jobseeker_ide_token_cookie>vscode-tkn=[^;]*)" $jobseeker_ide_token_cookie;
}

map $http_upgrade $jobseeker_ide_connection {
    default upgrade;
    ""      close;
}

server {
    # HTTP, or HTTPS when a certificate is mounted: written at start by
    # docker/nginx/40-jobseeker-workspace-gateway-tls.sh. Browsers only run
    # the service workers VS Code's notebooks and webviews need on HTTPS or
    # localhost, so a gateway reached by name (minipc.local) needs HTTPS.
    include /etc/nginx/conf.d/workspace-gateway-listen.inc;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 1g;

    # VS Code sends its own Content-Security-Policy; JobSeeker's would break
    # its webviews and workers, so only these headers are added.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location ~ "^/ide/(?<jobseeker_ide_port>3[1-4][0-9]{2})(?:/|$)" {
        set $jobseeker_ide_upstream docker-runtime:$jobseeker_ide_port;
        proxy_pass http://$jobseeker_ide_upstream;
        proxy_http_version 1.1;
        # VS Code compares the WebSocket's Origin with the Host it was sent to.
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jobseeker_ide_connection;
        proxy_set_header Cookie $jobseeker_ide_cookie;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_intercept_errors on;
        error_page 502 503 504 = @jobseeker_ide_unavailable;
    }

    location @jobseeker_ide_unavailable {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>Editor unavailable</title><body style="font:14px sans-serif;background:#ecf0f5;padding:40px"><div style="max-width:520px;margin:10vh auto;background:#fff;border-top:3px solid #007acc;padding:24px"><h2 style="margin-top:0">This editor is not running</h2><p>It stops after a while without a connected browser. Open the project again from JobSeeker (VS Code in the sidebar) to start it.</p></div>';
    }

    # Loads only when the browser trusts the gateway's certificate: the
    # launcher probes it (as an image, which JobSeeker's CSP allows) to
    # explain the warning an editor would open behind.
    location = /jobseeker-gateway-check.gif {
        add_header Cache-Control "no-store" always;
        empty_gif;
    }

    location / {
        return 404;
    }
}
