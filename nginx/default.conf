server {
    listen 0.0.0.0:8080;
    root /var/www/html;
    index index.html index.php;
    client_max_body_size 100M;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Do not advertise the nginx version on error pages / Server header.
    server_tokens off;

    # --- Security response headers (sent on every response, including errors) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # AdminLTE ships inline scripts/styles throughout, so 'unsafe-inline' is
    # required; 'unsafe-eval' is needed by DataTables/CKEditor. Everything else is
    # locked to same-origin plus the Google Fonts hosts the theme pulls from.
    # frame-src is left open to HTTPS so admin-configured BI embeds (Tableau,
    # Power BI, Superset, Grafana, ...) in the Analytics hub keep working; the
    # app vets those embeds itself. script/style/connect stay same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-src https:; child-src https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # Only meaningful once TLS terminates in front of the stack; harmless over plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Response compression ---
    # Server-side rendering is already fast; transfer size dominates. The Job
    # Creation page alone is ~470 KB of inline HTML and the AdminLTE theme ships
    # uncompressed CSS/JS, so compression is the single largest win here.
    #
    # Trade-off: csrf_regenerate is FALSE in application/config/config.php, so a
    # session's CSRF token is stable and compressed HTML is theoretically exposed
    # to BREACH. That attack additionally needs TLS plus attacker-chosen input
    # reflected into the same response. If a deployment terminates TLS and wants
    # to rule it out, drop `text/html` by setting `gzip_types` only for the static
    # types below and adding `gzip off;` inside `location ~* \.php$`.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    # --- Never serve application internals as static files ---
    # The compose stack bind-mounts ./application and ./system into the web root,
    # which would otherwise expose config/config.json (Jenkins credentials),
    # cached JSON under application/cache, and log files.
    location ~ ^/(application|system)/ {
        deny all;
        return 404;
    }

    # Block dotfiles (.env, .git, .htaccess, ...) - defence in depth.
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }

    # set expiration of static assets for caching
    location ~* ^/assets/.+\.(ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot|json)(\?[0-9]+)?$ {
        expires max;
        access_log off;
        log_not_found off;
    }

    location / {
        # Check if a file or directory index file exists, else route it to index.php.
        try_files $uri $uri/ /index.php;
    }

    location ~* \.php$ {
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        include fastcgi.conf;
        # Job creation and TMF pages contain sizeable inline forms. Keep
        # normal responses in memory instead of spilling them to nginx's
        # temporary filesystem and emitting a warning for every request.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
    }
}
