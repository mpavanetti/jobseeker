server {
        listen 0.0.0.0:8080;
    root /var/www/html;
    index index.html index.php;
    client_max_body_size 100M;
        resolver 127.0.0.11 valid=30s ipv6=off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Reverse-proxy to a persistent Spark cluster's published JupyterLab / Spark
    # master UI ports on the compute engine. Port is constrained to the
    # JOBSEEKER_SPARK_PERSISTENT_PORT_BASE range (18000-18999); the engine only
    # runs JobSeeker-managed Spark containers there. Declared before the static
    # asset location so Jupyter's own .js/.css assets proxy through.
    location ~ "^/spark-persist/(?<sp_port>18[0-9]{3})/(?<sp_rest>.*)$" {
            set $sp_upstream "docker-runtime:$sp_port";
            proxy_pass http://$sp_upstream/$sp_rest$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
    }

    # set expiration of assets to MAX for caching
    location ~* \.(ico|css|js|gif|jpe?g|png|json)(\?[0-9]+)?$ {
            expires max;
            log_not_found off;
    }

    location / {
            # Check if a file or directory index file exists, else route it to index.php.
            try_files $uri $uri/ /index.php;
    }

    location ~* \.php$ {
            set $php_upstream php:9000;
            fastcgi_pass $php_upstream;
            include fastcgi.conf;
            # Job creation and TMF pages contain sizeable inline forms. Keep
            # normal responses in memory instead of spilling them to nginx's
            # temporary filesystem and emitting a warning for every request.
            fastcgi_buffer_size 32k;
            fastcgi_buffers 8 32k;
            fastcgi_busy_buffers_size 64k;
    }
}
