services:

  nginx:
    build:
      context: .
      dockerfile: docker/ngnix_image
    ports: 
      - "80:8080"
    networks:
      - internal
    volumes:
      - ./application:/var/www/html/application
      - ./assets:/var/www/html/assets
      - ./system:/var/www/html/system
      - ./.project:/var/www/html/.project
      - ./index.php:/var/www/html/index.php
     # - ./logs/nginx:/var/log/nginx/

  php:
    build:
      context: .
      dockerfile: docker/php_image
    networks:
      - internal
    volumes:
      - ./application:/var/www/html/application
      - ./assets:/var/www/html/assets
      - ./system:/var/www/html/system
      - ./.project:/var/www/html/.project
      - ./index.php:/var/www/html/index.php
      - ./repository:/php/repository
      #- ./logs/php.log:/var/log/fpm-php.www.log
    environment:
      - CI_ENV=${CI_ENV:-production}
      - JOBSEEKER_DB_HOST=mariadb
      - JOBSEEKER_DB_USER=${JOBSEEKER_DB_USER:-mysql}
      - JOBSEEKER_DB_PASSWORD=${JOBSEEKER_DB_PASSWORD:-mysql}
      - JOBSEEKER_DB_NAME=${JOBSEEKER_DB_NAME:-jobseeker}
      - JOBSEEKER_ENCRYPTION_KEY=${JOBSEEKER_ENCRYPTION_KEY:-change-this-local-development-key-before-shared-use}
      - JOBSEEKER_COOKIE_SECURE=${JOBSEEKER_COOKIE_SECURE:-false}
      - JOBSEEKER_JENKINS_INTERNAL_URL=http://jenkins:8080/
      - JOBSEEKER_JENKINS_USER=${JENKINS_ADMIN_ID:-jobseeker}
      - JOBSEEKER_JENKINS_TOKEN=${JENKINS_ADMIN_PASSWORD:-jobseeker}

  mariadb:
    image: mariadb:10.7
    ports:
      - 3306:3306
    volumes:
      - "./config/mariadb:/var/lib/mysql"
      - "./db_setup.sql:/docker-entrypoint-initdb.d/1.sql"
    environment:
      - MYSQL_ROOT_PASSWORD=${JOBSEEKER_MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_PASSWORD=${JOBSEEKER_DB_PASSWORD:-mysql}
      - MYSQL_USER=${JOBSEEKER_DB_USER:-mysql}
      - MYSQL_DATABASE=${JOBSEEKER_DB_NAME:-jobseeker}
   # restart: on-failure
    networks:
      - internal

  jenkins:
    build:
      context: .
      dockerfile: docker/jenkins_image
    ports:
      - 8080:8080
      - 50000:50000
    volumes:
      - ./jenkins:/var/jenkins_home
      - ./repository:/php/repository
    networks:
        - internal
    environment:
      - JENKINS_ADMIN_ID=${JENKINS_ADMIN_ID:-jobseeker}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-jobseeker}
      - JENKINS_NUM_EXECUTORS=${JENKINS_NUM_EXECUTORS:-5}

networks:
  internal:
    driver: bridge