x-jobseeker-jenkins-agent-base: &jobseeker-jenkins-agent-base
  build:
    context: .
    dockerfile: docker/jenkins_agent_image
  image: jobseeker-jenkins-agent:local
  profiles:
    - jenkins-agents
  depends_on:
    docker-runtime:
      condition: service_healthy
    jenkins:
      condition: service_healthy
  networks:
    - internal
  env_file:
    - path: ./.env.connectors
      required: false

volumes:
  jobseeker-docker-cache: {}
  openvscode-server-data: {}
  jenkins-agent-dev-workdir: {}
  jenkins-agent-qa-workdir: {}
  jenkins-agent-uat-workdir: {}
  jenkins-agent-prod-workdir: {}

services:

  assets:
    image: node:20-alpine
    user: "${JOBSEEKER_HOST_UID:-1000}:${JOBSEEKER_HOST_GID:-1000}"
    working_dir: /workspace
    command: sh -lc "npm ci --no-audit --no-fund"
    environment:
      - NPM_CONFIG_CACHE=/tmp/.npm
    volumes:
      - .:/workspace
    networks:
      - internal

  nginx:
    build:
      context: .
      dockerfile: docker/nginx_image
    depends_on:
      assets:
        condition: service_completed_successfully
      php:
        condition: service_healthy
    ports: 
      - "${JOBSEEKER_HTTP_PORT:-80}:8080"
    networks:
      - internal
    volumes:
      - ./application:/var/www/html/application
      - ./assets:/var/www/html/assets
      - ./system:/var/www/html/system
      - ./.project:/var/www/html/.project
      - ./index.php:/var/www/html/index.php
     # - ./logs/nginx:/var/log/nginx/
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  php:
    build:
      context: .
      dockerfile: docker/php_image
    depends_on:
      mariadb:
        condition: service_healthy
      docker-monitor-proxy:
        condition: service_healthy
    networks:
      - internal
      - monitoring
    volumes:
      - ./application:/var/www/html/application
      - ./assets:/var/www/html/assets
      - ./system:/var/www/html/system
      - ./.project:/var/www/html/.project
      - ./index.php:/var/www/html/index.php
      - ./repository:/php/repository
      #- ./logs/php.log:/var/log/fpm-php.www.log
    environment:
      - CI_ENV=${CI_ENV:-production}
      - JOBSEEKER_DB_HOST=mariadb
      - JOBSEEKER_DB_USER=${JOBSEEKER_DB_USER:-mysql}
      - JOBSEEKER_DB_PASSWORD=${JOBSEEKER_DB_PASSWORD:-mysql}
      - JOBSEEKER_DB_NAME=${JOBSEEKER_DB_NAME:-jobseeker}
      - JOBSEEKER_ENCRYPTION_KEY=${JOBSEEKER_ENCRYPTION_KEY:-change-this-local-development-key-before-shared-use}
      - JOBSEEKER_CONNECTOR_API_TOKEN=${JOBSEEKER_CONNECTOR_API_TOKEN:-jobseeker-local-connector-token}
      - JOBSEEKER_COOKIE_SECURE=${JOBSEEKER_COOKIE_SECURE:-false}
      - JOBSEEKER_COMMAND_GUARD_ENFORCE=${JOBSEEKER_COMMAND_GUARD_ENFORCE:-false}
      - JOBSEEKER_TIMEZONE=${JOBSEEKER_TIMEZONE:-UTC}
      - JOBSEEKER_JENKINS_INTERNAL_URL=http://jenkins:8080/
      - JOBSEEKER_JENKINS_PUBLIC_URL=${JOBSEEKER_JENKINS_PUBLIC_URL:-http://localhost:8080/}
      - JOBSEEKER_MAILPIT_HTTP_PORT=${JOBSEEKER_MAILPIT_HTTP_PORT:-8025}
      - JOBSEEKER_MAILPIT_PUBLIC_URL=${JOBSEEKER_MAILPIT_PUBLIC_URL:-}
      - JOBSEEKER_OPENVSCODE_ENABLED=${JOBSEEKER_OPENVSCODE_ENABLED:-true}
      - JOBSEEKER_OPENVSCODE_PORT=${JOBSEEKER_OPENVSCODE_PORT:-3000}
      - JOBSEEKER_OPENVSCODE_PUBLIC_URL=${JOBSEEKER_OPENVSCODE_PUBLIC_URL:-}
      - JOBSEEKER_OPENVSCODE_WORKSPACE=${JOBSEEKER_OPENVSCODE_WORKSPACE:-/home/workspace}
      - JOBSEEKER_OPENVSCODE_TOKEN=${JOBSEEKER_OPENVSCODE_TOKEN:-jobseeker-local-vscode}
      - JOBSEEKER_OPENVSCODE_INTERNAL_URL=http://openvscode:3000
      - JOBSEEKER_OPENVSCODE_IDLE_TIMEOUT_MINUTES=${JOBSEEKER_OPENVSCODE_IDLE_TIMEOUT_MINUTES:-30}
      - JOBSEEKER_DOCKER_MONITOR_URL=http://docker-monitor-proxy:8080
      - JOBSEEKER_DOCKER_RUNTIME_URL=http://docker-runtime:2375
      - JOBSEEKER_DEFAULT_DOCKER_PYTHON_VERSION=${JOBSEEKER_DEFAULT_DOCKER_PYTHON_VERSION:-3.13}
      # Data Engineering (Spark clusters / ML runtimes)
      - JOBSEEKER_COMPUTE_DRIVER=${JOBSEEKER_COMPUTE_DRIVER:-docker}
      - JOBSEEKER_COMPUTE_REPOSITORY_ROOT=/php/repository
      - JOBSEEKER_SPARK_BIND_SOURCE=/jobseeker/src/spark
      - JOBSEEKER_ML_BIND_SOURCE=/jobseeker/src/ml
      - JOBSEEKER_SPARK_MAX_WORKERS=${JOBSEEKER_SPARK_MAX_WORKERS:-8}
      - JOBSEEKER_COMPUTE_RUN_TIMEOUT_SECONDS=${JOBSEEKER_COMPUTE_RUN_TIMEOUT_SECONDS:-1800}
      - JOBSEEKER_COMPUTE_MAX_CONCURRENT_RUNS=${JOBSEEKER_COMPUTE_MAX_CONCURRENT_RUNS:-3}
      - JOBSEEKER_JENKINS_USER=${JENKINS_ADMIN_ID:-jobseeker}
      - JOBSEEKER_JENKINS_TOKEN=${JENKINS_ADMIN_PASSWORD:-jobseeker}
      - JOBSEEKER_JENKINS_DEFAULT_ENVIRONMENT_SLOTS=${JOBSEEKER_JENKINS_DEFAULT_ENVIRONMENT_SLOTS:-1}
      - JOBSEEKER_JENKINS_ENVIRONMENT_SLOTS=${JOBSEEKER_JENKINS_ENVIRONMENT_SLOTS:-DEV=2}
      - JOBSEEKER_JENKINS_ENVIRONMENT_AGENTS_ENABLED=${JOBSEEKER_JENKINS_ENVIRONMENT_AGENTS_ENABLED:-true}
      - JOBSEEKER_JENKINS_ENVIRONMENT_AGENT_LABELS=${JOBSEEKER_JENKINS_ENVIRONMENT_AGENT_LABELS:-DEV=jobseeker-env-dev,QA=jobseeker-env-qa,UAT=jobseeker-env-uat,PROD=jobseeker-env-prod}
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mariadb:
    image: mariadb:10.7
    command: --default-time-zone=+00:00
    ports:
      - "${JOBSEEKER_DB_PORT:-3306}:3306"
    volumes:
      - "./config/mariadb:/var/lib/mysql"
      - "./db_setup.sql:/docker-entrypoint-initdb.d/1.sql"
    environment:
      - MYSQL_ROOT_PASSWORD=${JOBSEEKER_MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_PASSWORD=${JOBSEEKER_DB_PASSWORD:-mysql}
      - MYSQL_USER=${JOBSEEKER_DB_USER:-mysql}
      - MYSQL_DATABASE=${JOBSEEKER_DB_NAME:-jobseeker}
   # restart: on-failure
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${JOBSEEKER_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${JOBSEEKER_MAILPIT_HTTP_PORT:-8025}:8025"
    networks:
      - internal

  openvscode-data-init:
    image: alpine:3.20
    command: sh -lc "mkdir -p /openvscode/data /openvscode/python && chown -R 1000:1000 /openvscode/data /openvscode/python"
    volumes:
      - openvscode-server-data:/openvscode
    networks:
      - internal

  openvscode:
    container_name: jobseeker-openvscode
    build:
      context: .
      dockerfile: docker/openvscode_image
    image: jobseeker-openvscode:local
    init: true
    depends_on:
      openvscode-data-init:
        condition: service_completed_successfully
    entrypoint:
      - /usr/local/bin/jobseeker-openvscode
    command:
      - /home/workspace/repository
    environment:
      - JOBSEEKER_OPENVSCODE_TOKEN=${JOBSEEKER_OPENVSCODE_TOKEN:-jobseeker-local-vscode}
      - JOBSEEKER_OPENVSCODE_IDLE_TIMEOUT_MINUTES=${JOBSEEKER_OPENVSCODE_IDLE_TIMEOUT_MINUTES:-30}
      - UV_PYTHON_INSTALL_DIR=/home/workspace/.openvscode-server/python
    ports:
      - "${JOBSEEKER_OPENVSCODE_HOST:-127.0.0.1}:${JOBSEEKER_OPENVSCODE_PORT:-3000}:3000"
    volumes:
      - ./repository:/home/workspace/repository
      # Job workspaces may consume the SDK and its wheel, but must never edit
      # the shared source used to build wheels for other jobs.
      - type: bind
        source: ./repository/python/lib/jobseeker-sdk
        target: /home/workspace/repository/python/lib/jobseeker-sdk
        read_only: true
      - type: volume
        source: openvscode-server-data
        target: /home/workspace/.openvscode-server/data
        volume:
          subpath: data
      - type: volume
        source: openvscode-server-data
        target: /home/workspace/.openvscode-server/python
        volume:
          subpath: python
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null \"http://127.0.0.1:3000/?tkn=$${JOBSEEKER_OPENVSCODE_TOKEN}\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  docker-monitor-proxy:
    image: nginx:alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/monitor/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/_ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  docker-runtime:
    image: docker:27-dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    volumes:
      - jobseeker-docker-cache:/var/lib/docker
      # Spark / ML job source, visible to the DinD daemon so ephemeral job
      # containers can bind-mount it at /workspace (read-only).
      # Mount the whole repository (a directory that always exists) rather than
      # its spark/ and ml/ children - a child dir recreated by git would leave a
      # stale bind and every job container would fail to start.
      - ./repository:/jobseeker/src:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Build the JobSeeker Spark / ML runtime images into the DinD engine.
  #   docker compose --profile runtimes up --build
  spark-runtime-builder:
    image: docker:27-cli
    profiles: ["runtimes"]
    depends_on:
      docker-runtime:
        condition: service_healthy
    environment:
      - DOCKER_HOST=tcp://docker-runtime:2375
    volumes:
      - ./docker:/context/docker:ro
    working_dir: /context
    command: >
      sh -lc "docker build -t jobseeker/spark-runtime:4.0.0-python -f docker/spark/Dockerfile.spark-4.0-python docker/spark &&
              docker build -t jobseeker/spark-runtime:4.0.0-scala  -f docker/spark/Dockerfile.spark-4.0-scala  docker/spark"
    networks:
      - internal

  ml-runtime-builder:
    image: docker:27-cli
    profiles: ["runtimes"]
    depends_on:
      docker-runtime:
        condition: service_healthy
    environment:
      - DOCKER_HOST=tcp://docker-runtime:2375
    volumes:
      - ./docker:/context/docker:ro
    working_dir: /context
    command: >
      sh -lc "docker build -t jobseeker/ml-runtime:cpu    -f docker/ml/Dockerfile.ml-cpu    docker/ml &&
              docker build -t jobseeker/ml-runtime:dl-cpu -f docker/ml/Dockerfile.ml-dl-cpu docker/ml"
    networks:
      - internal

  jenkins-home-init:
    image: alpine:3.20
    command: sh -lc "mkdir -p /var/jenkins_home && chown -R ${JOBSEEKER_JENKINS_UID:-1000}:${JOBSEEKER_JENKINS_GID:-1000} /var/jenkins_home"
    volumes:
      - ./jenkins:/var/jenkins_home
    networks:
      - internal

  jenkins:
    build:
      context: .
      dockerfile: docker/jenkins_image
    depends_on:
      docker-runtime:
        condition: service_healthy
      jenkins-home-init:
        condition: service_completed_successfully
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - ./jenkins:/var/jenkins_home
      - ./repository:/php/repository
    networks:
        - internal
    env_file:
      - path: ./.env.connectors
        required: false
    environment:
      - JENKINS_ADMIN_ID=${JENKINS_ADMIN_ID:-jobseeker}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-jobseeker}
      - JENKINS_NUM_EXECUTORS=${JENKINS_NUM_EXECUTORS:-2}
      - JENKINS_AGENT_PORT=${JENKINS_AGENT_PORT:-50000}
      - JOBSEEKER_DB_HOST=mariadb
      - JOBSEEKER_DB_PORT=3306
      - JOBSEEKER_DB_USER=${JOBSEEKER_DB_USER:-mysql}
      - JOBSEEKER_DB_PASSWORD=${JOBSEEKER_DB_PASSWORD:-mysql}
      - JOBSEEKER_DB_NAME=${JOBSEEKER_DB_NAME:-jobseeker}
      - JOBSEEKER_CONNECTOR_API_URL=http://nginx:8080/connector-runtime
      - JOBSEEKER_CONNECTOR_API_TOKEN=${JOBSEEKER_CONNECTOR_API_TOKEN:-jobseeker-local-connector-token}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - AZURE_FEDERATED_TOKEN_FILE=${AZURE_FEDERATED_TOKEN_FILE:-}
      - AZURE_AUTHORITY_HOST=${AZURE_AUTHORITY_HOST:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_ROLE_ARN=${AWS_ROLE_ARN:-}
      - AWS_WEB_IDENTITY_TOKEN_FILE=${AWS_WEB_IDENTITY_TOKEN_FILE:-}
      - JOBSEEKER_SMTP_HOST=${JOBSEEKER_SMTP_HOST:-mailpit}
      - JOBSEEKER_SMTP_PORT=${JOBSEEKER_SMTP_PORT:-1025}
      - JOBSEEKER_SMTP_SSL=${JOBSEEKER_SMTP_SSL:-false}
      - JOBSEEKER_SMTP_REPLY_TO=${JOBSEEKER_SMTP_REPLY_TO:-jobseeker@local.test}
      - JOBSEEKER_JENKINS_ROOT_URL=${JOBSEEKER_JENKINS_PUBLIC_URL:-http://localhost:8080/}
      - DOCKER_HOST=${JOBSEEKER_DOCKER_HOST:-tcp://docker-runtime:2375}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  jenkins-agent-dev:
    <<: *jobseeker-jenkins-agent-base
    environment:
      JENKINS_URL: http://jenkins:8080/
      JENKINS_USER: ${JENKINS_ADMIN_ID:-jobseeker}
      JENKINS_TOKEN: ${JENKINS_ADMIN_PASSWORD:-jobseeker}
      JENKINS_AGENT_NAME: ${JOBSEEKER_JENKINS_DEV_AGENT_NAME:-jobseeker-dev-agent}
      JENKINS_AGENT_DESCRIPTION: JobSeeker DEV environment worker
      JENKINS_AGENT_EXECUTORS: ${JOBSEEKER_JENKINS_DEV_AGENT_EXECUTORS:-2}
      JENKINS_AGENT_LABELS: ${JOBSEEKER_JENKINS_DEV_AGENT_LABELS:-jobseeker jobseeker-env-dev env-dev DEV}
      JENKINS_AGENT_WEB_SOCKET: ${JOBSEEKER_JENKINS_AGENT_WEB_SOCKET:-false}
      JENKINS_AGENT_TUNNEL: ${JOBSEEKER_JENKINS_AGENT_TUNNEL:-jenkins:50000}
      DOCKER_HOST: ${JOBSEEKER_DOCKER_HOST:-tcp://docker-runtime:2375}
      JOBSEEKER_CONNECTOR_API_URL: http://nginx:8080/connector-runtime
      JOBSEEKER_CONNECTOR_API_TOKEN: ${JOBSEEKER_CONNECTOR_API_TOKEN:-jobseeker-local-connector-token}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_FEDERATED_TOKEN_FILE: ${AZURE_FEDERATED_TOKEN_FILE:-}
      AZURE_AUTHORITY_HOST: ${AZURE_AUTHORITY_HOST:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}
    volumes:
      - ./repository:/php/repository
      - jenkins-agent-dev-workdir:/home/jenkins/agent

  jenkins-agent-qa:
    <<: *jobseeker-jenkins-agent-base
    environment:
      JENKINS_URL: http://jenkins:8080/
      JENKINS_USER: ${JENKINS_ADMIN_ID:-jobseeker}
      JENKINS_TOKEN: ${JENKINS_ADMIN_PASSWORD:-jobseeker}
      JENKINS_AGENT_NAME: ${JOBSEEKER_JENKINS_QA_AGENT_NAME:-jobseeker-qa-agent}
      JENKINS_AGENT_DESCRIPTION: JobSeeker QA environment worker
      JENKINS_AGENT_EXECUTORS: ${JOBSEEKER_JENKINS_QA_AGENT_EXECUTORS:-1}
      JENKINS_AGENT_LABELS: ${JOBSEEKER_JENKINS_QA_AGENT_LABELS:-jobseeker jobseeker-env-qa env-qa QA QAS}
      JENKINS_AGENT_WEB_SOCKET: ${JOBSEEKER_JENKINS_AGENT_WEB_SOCKET:-false}
      JENKINS_AGENT_TUNNEL: ${JOBSEEKER_JENKINS_AGENT_TUNNEL:-jenkins:50000}
      DOCKER_HOST: ${JOBSEEKER_DOCKER_HOST:-tcp://docker-runtime:2375}
      JOBSEEKER_CONNECTOR_API_URL: http://nginx:8080/connector-runtime
      JOBSEEKER_CONNECTOR_API_TOKEN: ${JOBSEEKER_CONNECTOR_API_TOKEN:-jobseeker-local-connector-token}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_FEDERATED_TOKEN_FILE: ${AZURE_FEDERATED_TOKEN_FILE:-}
      AZURE_AUTHORITY_HOST: ${AZURE_AUTHORITY_HOST:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}
    volumes:
      - ./repository:/php/repository
      - jenkins-agent-qa-workdir:/home/jenkins/agent

  jenkins-agent-uat:
    <<: *jobseeker-jenkins-agent-base
    environment:
      JENKINS_URL: http://jenkins:8080/
      JENKINS_USER: ${JENKINS_ADMIN_ID:-jobseeker}
      JENKINS_TOKEN: ${JENKINS_ADMIN_PASSWORD:-jobseeker}
      JENKINS_AGENT_NAME: ${JOBSEEKER_JENKINS_UAT_AGENT_NAME:-jobseeker-uat-agent}
      JENKINS_AGENT_DESCRIPTION: JobSeeker UAT environment worker
      JENKINS_AGENT_EXECUTORS: ${JOBSEEKER_JENKINS_UAT_AGENT_EXECUTORS:-1}
      JENKINS_AGENT_LABELS: ${JOBSEEKER_JENKINS_UAT_AGENT_LABELS:-jobseeker jobseeker-env-uat env-uat UAT}
      JENKINS_AGENT_WEB_SOCKET: ${JOBSEEKER_JENKINS_AGENT_WEB_SOCKET:-false}
      JENKINS_AGENT_TUNNEL: ${JOBSEEKER_JENKINS_AGENT_TUNNEL:-jenkins:50000}
      DOCKER_HOST: ${JOBSEEKER_DOCKER_HOST:-tcp://docker-runtime:2375}
      JOBSEEKER_CONNECTOR_API_URL: http://nginx:8080/connector-runtime
      JOBSEEKER_CONNECTOR_API_TOKEN: ${JOBSEEKER_CONNECTOR_API_TOKEN:-jobseeker-local-connector-token}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_FEDERATED_TOKEN_FILE: ${AZURE_FEDERATED_TOKEN_FILE:-}
      AZURE_AUTHORITY_HOST: ${AZURE_AUTHORITY_HOST:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}
    volumes:
      - ./repository:/php/repository
      - jenkins-agent-uat-workdir:/home/jenkins/agent

  jenkins-agent-prod:
    <<: *jobseeker-jenkins-agent-base
    environment:
      JENKINS_URL: http://jenkins:8080/
      JENKINS_USER: ${JENKINS_ADMIN_ID:-jobseeker}
      JENKINS_TOKEN: ${JENKINS_ADMIN_PASSWORD:-jobseeker}
      JENKINS_AGENT_NAME: ${JOBSEEKER_JENKINS_PROD_AGENT_NAME:-jobseeker-prod-agent}
      JENKINS_AGENT_DESCRIPTION: JobSeeker PROD environment worker
      JENKINS_AGENT_EXECUTORS: ${JOBSEEKER_JENKINS_PROD_AGENT_EXECUTORS:-1}
      JENKINS_AGENT_LABELS: ${JOBSEEKER_JENKINS_PROD_AGENT_LABELS:-jobseeker jobseeker-env-prod env-prod PROD PRD PRODUCTION}
      JENKINS_AGENT_WEB_SOCKET: ${JOBSEEKER_JENKINS_AGENT_WEB_SOCKET:-false}
      JENKINS_AGENT_TUNNEL: ${JOBSEEKER_JENKINS_AGENT_TUNNEL:-jenkins:50000}
      DOCKER_HOST: ${JOBSEEKER_DOCKER_HOST:-tcp://docker-runtime:2375}
      JOBSEEKER_CONNECTOR_API_URL: http://nginx:8080/connector-runtime
      JOBSEEKER_CONNECTOR_API_TOKEN: ${JOBSEEKER_CONNECTOR_API_TOKEN:-jobseeker-local-connector-token}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_FEDERATED_TOKEN_FILE: ${AZURE_FEDERATED_TOKEN_FILE:-}
      AZURE_AUTHORITY_HOST: ${AZURE_AUTHORITY_HOST:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
