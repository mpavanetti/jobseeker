apiVersion: v1
kind: Secret
metadata:
  name: jobseeker-secrets
  labels:
    app.kubernetes.io/name: jobseeker
type: Opaque
stringData:
  # Development placeholders only. Replace every value in an overlay or with
  # an external Secret controller before exposing the installation.
  database-user: mysql
  database-password: replace-with-a-random-database-password
  database-root-password: replace-with-a-random-root-password
  database-name: jobseeker
  encryption-key: replace-with-at-least-32-random-characters
  connector-api-token: replace-with-a-long-random-connector-token
  jenkins-admin-user: jobseeker
  jenkins-admin-password: replace-with-a-random-jenkins-password
  openvscode-token: replace-with-a-random-openvscode-token
