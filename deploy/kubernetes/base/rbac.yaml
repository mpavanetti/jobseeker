apiVersion: v1
kind: ServiceAccount
metadata:
  name: jobseeker-jenkins
  labels:
    app.kubernetes.io/name: jobseeker
    app.kubernetes.io/component: jenkins
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jobseeker-agent
  labels:
    app.kubernetes.io/name: jobseeker
    app.kubernetes.io/component: jenkins-agent
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jobseeker-jenkins-agent-manager
  labels:
    app.kubernetes.io/name: jobseeker
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jobseeker-jenkins-agent-manager
  labels:
    app.kubernetes.io/name: jobseeker
subjects:
  - kind: ServiceAccount
    name: jobseeker-jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jobseeker-jenkins-agent-manager
