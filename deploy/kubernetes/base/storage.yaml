  labels:
    app.kubernetes.io/name: jobseeker
    app.kubernetes.io/component: mariadb
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
