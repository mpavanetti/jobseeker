apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jobseeker-repository
  labels:
    app.kubernetes.io/name: jobseeker
    app.kubernetes.io/component: repository
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jobseeker-app-state
  labels:
    app.kubernetes.io/name: jobseeker
    app.kubernetes.io/component: app-state
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jobseeker-jenkins-home
  labels:
    app.kubernetes.io/name: jobseeker
    app.kubernetes.io/component: jenkins
