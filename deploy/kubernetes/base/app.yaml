apiVersion: apps/v1
kind: Deployment
metadata:
  name: php
  labels:
    app.kubernetes.io/name: jobseeker
    app.kubernetes.io/component: php
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobseeker
      app.kubernetes.io/component: php
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobseeker
        app.kubernetes.io/component: php
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-repository
          image: jobseeker-php:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              set -eu;
              mkdir -p /repository/data-assets /repository/python/inline /repository/python/jobs
              /repository/python/lib/jobseeker-sdk /repository/bash/jobs /repository/batch/jobs
              /repository/talend/jobs;
              cp -R /var/www/html/application/third_party/python/jobseeker_sdk/.
              /repository/python/lib/jobseeker-sdk/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: repository
              mountPath: /repository
      containers:
        - name: php
          image: jobseeker-php:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: fastcgi
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: jobseeker-config
          env:
            - name: JOBSEEKER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: jobseeker-secrets
                  key: database-user
            - name: JOBSEEKER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobseeker-secrets
                  key: database-password
            - name: JOBSEEKER_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: jobseeker-secrets
                  key: database-name
            - name: JOBSEEKER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: jobseeker-secrets
                  key: encryption-key
            - name: JOBSEEKER_CONNECTOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jobseeker-secrets
                  key: connector-api-token
            - name: JOBSEEKER_JENKINS_USER
              valueFrom:
                secretKeyRef:
                  name: jobseeker-secrets
                  key: jenkins-admin-user
            - name: JOBSEEKER_JENKINS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jobseeker-secrets
                  key: jenkins-admin-password
            - name: JOBSEEKER_OPENVSCODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jobseeker-secrets
                  key: openvscode-token
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["php-fpm", "-t"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["php-fpm", "-t"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: repository
              mountPath: /php/repository
            - name: app-state
              mountPath: /var/www/html/application/cache
            - name: runtime-config
              mountPath: /var/www/html/application/config/config.json
              subPath: config.json
              readOnly: true
            - name: logs
              mountPath: /var/www/html/application/logs
      volumes:
        - name: repository
          persistentVolumeClaim:
            claimName: jobseeker-repository
        - name: app-state
          persistentVolumeClaim:
            claimName: jobseeker-app-state
        - name: runtime-config
          configMap:
            name: jobseeker-runtime-config
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: php
  labels:
    app.kubernetes.io/name: jobseeker
    app.kubernetes.io/component: php
spec:
  selector:
    app.kubernetes.io/name: jobseeker
    app.kubernetes.io/component: php
  ports:
    - name: fastcgi
      port: 9000
      targetPort: fastcgi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: jobseeker
    app.kubernetes.io/component: nginx
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobseeker
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobseeker
        app.kubernetes.io/component: nginx
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: jobseeker-nginx:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              cp /etc/nginx/default.kubernetes.conf /etc/nginx/conf.d/default.conf &&
              exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: jobseeker
    app.kubernetes.io/component: nginx
spec:
  selector:
    app.kubernetes.io/name: jobseeker
    app.kubernetes.io/component: nginx
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php
  labels:
    app.kubernetes.io/name: jobseeker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: jobseeker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: php
  labels:
    app.kubernetes.io/name: jobseeker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobseeker
      app.kubernetes.io/component: php
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: jobseeker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobseeker
      app.kubernetes.io/component: nginx
