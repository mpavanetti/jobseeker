user root;
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    upstream docker_engine {
        server unix:/var/run/docker.sock;
        keepalive 8;
    }

    server {
        listen 8080;

        location = /_ping {
            limit_except GET { deny all; }
            proxy_pass http://docker_engine;
        }

        location = /version {
            limit_except GET { deny all; }
            proxy_pass http://docker_engine;
        }

        location = /info {
            limit_except GET { deny all; }
            proxy_pass http://docker_engine;
        }

        location = /system/df {
            limit_except GET { deny all; }
            proxy_pass http://docker_engine;
        }

        location = /containers/json {
            limit_except GET { deny all; }
            proxy_pass http://docker_engine;
        }

        location ~ "^/containers/[a-f0-9]{12,64}/(json|stats)$" {
            limit_except GET { deny all; }
            proxy_pass http://docker_engine;
        }

        location = /containers/jobseeker-openvscode/json {
            limit_except GET { deny all; }
            proxy_pass http://docker_engine;
        }

        # Mutating operations are limited to starting the fixed OpenVSCode
        # container and pruning unused build cache. Creation, stop, exec,
        # container/image/volume/network deletion and broad system prune remain
        # intentionally unavailable.
        location = /containers/jobseeker-openvscode/start {
            limit_except POST { deny all; }
            proxy_pass http://docker_engine;
        }

        location = /build/prune {
            limit_except POST { deny all; }
            proxy_read_timeout 20s;
            proxy_pass http://docker_engine;
        }

        location / {
            return 403;
        }
    }
}
