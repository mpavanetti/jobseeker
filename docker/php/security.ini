; The session cookie carries the authenticated session, so it must not ride
; along on cross-site requests. CodeIgniter 3.1.10 sets its cookies through the
; positional setcookie()/session_set_cookie_params() signatures, which have no
; SameSite argument, so it is set here instead. Browsers default an unset
; SameSite to Lax, but only after a grace period on top-level POSTs - declaring
; it removes that gap.
session.cookie_samesite = Lax

; Never let PHP announce its version in the Server/X-Powered-By headers.
expose_php = Off
