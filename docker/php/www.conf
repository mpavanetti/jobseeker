[www]
; JobSeeker pages can hold a PHP worker while polling Jenkins. The image
; default of five workers is too small when the dashboard and preview UI are
; active together, so keep a modest warm pool and recycle long-lived workers.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
