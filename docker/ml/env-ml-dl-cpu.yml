# Conda environment for jobseeker/ml-runtime:dl-cpu (base packages).
# PyTorch itself is installed with pip from the official CPU wheel index in the
# Dockerfile - the conda-forge pytorch builds are less predictable across tags.
name: base
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.4
  - pandas=2.2.2
  - scikit-learn=1.5.1
  - pip
