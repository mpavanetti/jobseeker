# Conda environment for jobseeker/ml-runtime:dl-cpu.
# CPU deep learning (PyTorch + Lightning). Versions pinned for reproducible builds.
name: base
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.4
  - pandas=2.2.2
  - scikit-learn=1.5.1
  - pytorch-cpu=2.3.1
  - torchvision-cpu=0.18.1
  - lightning=2.3.3
