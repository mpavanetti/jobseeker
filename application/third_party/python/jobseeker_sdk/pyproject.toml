[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobseeker-runtime"
version = "0.4.0"
description = "JobSeeker Python SDK for TMF, context lookup, runtime data assets, and scoped connectors"
requires-python = ">=3.8"
dependencies = [
    "mysql-connector-python>=9.4.0",
]

[project.scripts]
jobseeker-asset = "jobseeker:asset_cli"
jobseeker-connector = "jobseeker:connector_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobseeker = ["py.typed"]
